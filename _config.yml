# Site settings
# Values here are read by the layouts/includes via {{ site.* }}.
title: timschnell.dev
subtitle: 
name: Tim Schnell
email: timductive@gmail.com
url: https://timschnell.dev
description: >-
  Software Engineering Management thoughts and quandaries.
github_username: timductive

# Identity shown in the header/footer wordmark: ~/timschnell.dev
wordmark:
  prefix: "~/"
  name: "timschnell"
  tld: ".dev"
# Set to true to show the Work page everywhere: nav, hero button, home section, search.
show_work: false
# Set to true to show the "Now" section (from _data/now.yml) on the home page.
show_now: false
location: "Austin, Texas"
disclaimer: "Thoughts & opinions are my own."

# Home hero copy
hero:
  command: whoami
  name: Tim Schnell
  role: Software Engineering Leader
  lede: "Growing teams, shipping code and debugging the system."
  body: "Leadership, politics, power dynamics, integrity, confidence, empathy, intelligence, context; what makes us human, makes our software. Here be dragons, roll for initiative."

# Page intros
blog_intro: "Notes on engineering leadership, agentic development practice, and the parts of front-end craft that don't go out of style."
work_intro:
search_intro: "Everything on the site — posts, work, and pages — in one index."

author:
  name   : "Tim Schnell"
  avatar : "/assets/images/tim-bio-min.png"
  portrait: "/assets/images/tim-bio.jpg"
  title  : "Director of Engineering, Elastic"
  bio    : "Director of Engineering @elastic, previously @rackspace and a sundry of startups. Thoughts & opinions are my own."
  # icon is a name understood by _includes/icon.html
  links:
    - label: "GitHub"
      icon: github
      url: "https://github.com/timductive"
    - label: "LinkedIn"
      icon: linkedin
      url: "https://www.linkedin.com/in/timschnell"
    - label: "Facebook"
      icon: facebook
      url: "https://www.facebook.com/tim.schnell"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
timezone: America/Chicago

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

collections:
  work:
    output: false

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-gist
  - jemoji

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
