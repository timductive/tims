---
layout: default
---
<div class="container">
  <div class="page">
    <header class="page__head">
      {%- if page.cmd %}{% include cmd.html text=page.cmd %}{% endif %}
      <h1 class="page__title">{{ page.title }}</h1>
      {%- if page.description %}<p class="page__intro">{{ page.description }}</p>{% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</div>
