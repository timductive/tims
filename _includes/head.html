{%- assign asset_stamp = site.time | date: "%s" -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0F0D">
<style>
  /* Paint the shell before main.css arrives so navigation never flashes light. */
  html { background: #0B0F0D; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #0B0F0D; color: #E8EDE9; }
</style>

{% seo %}

<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}?v={{ asset_stamp }}">
<link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}?v={{ asset_stamp }}" sizes="32x32">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}?v={{ asset_stamp }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}?v={{ asset_stamp }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}?v={{ asset_stamp }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="{{ '/feed.xml' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Space+Grotesk:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_stamp }}">
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ asset_stamp }}" defer></script>
{%- if page.layout == "search" %}
<script src="{{ '/assets/js/vendor/lunr.min.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/search.js' | relative_url }}?v={{ asset_stamp }}" defer></script>
{%- endif %}
